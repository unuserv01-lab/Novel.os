[project]
name = "novelos"
version = "0.1.0"
description = "Novel.os - autonomous manhwa production system (MVP 0.1 vertical slice)"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "pydantic>=2.5", "pillow>=10", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
tts = ["edge-tts>=6"]  # Microsoft Edge TTS: 100% free, no API key (needs network)

[project.scripts]
novelos = "novelos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novelos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
